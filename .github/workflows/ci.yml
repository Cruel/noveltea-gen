name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Live Pi/provider calls and hosted tracing are deliberately excluded.
# Rootless full-stack SQLite/PostgreSQL certification is mandatory and uses
# generated local fixtures, never model credentials.
env:
  CI: "true"
  NT_LIVE_TEST: "0"
  NT_LIVE_GENERATION: "0"
  NT_LIVE_GENERATION_IDEA: "0"
  NT_LIVE_FOUNDATION: "0"
  NT_LIVE_FOUNDATIONS: "0"
  NT_LIVE_INTERACTIVE: "0"
  NT_LIVE_COMPOSITION: "0"
  NT_LIVE_EVENT: "0"
  NT_LIVE_NARRATIVE_REVIEW: "0"
  NT_TEST_WEB_REAL_PI: "0"
  NT_TEST_ROOTLESS_SANDBOX: "0"
  LANGSMITH_TRACING: "false"
  LANGCHAIN_TRACING_V2: "false"
  TRACE_TO_LANGSMITH: "false"

jobs:
  offline:
    name: Typecheck, offline tests and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # CI-provisioned PostgreSQL for mandatory shared transaction, schema and parity gates.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: noveltea_test
          POSTGRES_PASSWORD: noveltea_test_only
          POSTGRES_DB: noveltea_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noveltea_test -d noveltea_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      NT_TEST_PG_URL: postgresql://noveltea_test:noveltea_test_only@127.0.0.1:5432/noveltea_test
      NT_KYSELY_PROOF_URL: postgresql://noveltea_test:noveltea_test_only@127.0.0.1:5432/noveltea_test
      NT_REQUIRE_KYSELY_PROOF: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: "11.15.0"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Configure Git identity for disposable test repositories
        run: |
          git config --global user.name "NovelTea CI"
          git config --global user.email "ci@noveltea.invalid"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Offline CI has no native CLI artifact: run the credential-free,
      # native-independent test sets. The integration job below exercises the
      # full root and Studio suites against a real native CLI when available.
      - name: Typecheck, build and run offline-safe root and Studio tests
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test:offline
          pnpm build
          pnpm --filter @noveltea/studio typecheck
          # Nitro must ship byte-identical immutable migration assets: the
          # production bundle runs its own read-only schema certification.
          pnpm --filter @noveltea/studio build
          pnpm --filter @noveltea/studio typegen:check
          pnpm --filter @noveltea/studio test:offline
          pnpm --filter @noveltea/studio schema:parity

  compose-certification:
    name: Rootless Compose (SQLite + PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: "11.15.0"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start an independent rootless Docker daemon
        run: bash scripts/ci-start-rootless-docker.sh
      - name: Prepare credential-free native prerequisites
        run: |
          # Database/Compose startup only needs an executable CLI --version
          # and skills directory. Other native commands fail explicitly.
          fixtures="$RUNNER_TEMP/noveltea-compose-fixtures"
          mkdir -p "$fixtures/skills/skills/nt-story-architecture"
          printf '%s\n' '# Disposable Compose certification skills directory' > "$fixtures/skills/skills/nt-story-architecture/SKILL.md"
          printf '%s\n' '#!/bin/sh' 'if [ "$1" = "--version" ]; then echo "noveltea 1.0.0"; else echo "CI fixture: native CLI execution prohibited" >&2; exit 64; fi' > "$fixtures/noveltea"
          chmod 0755 "$fixtures/noveltea"
          echo "NT_NATIVE_CLI_HOST=$fixtures/noveltea" >> "$GITHUB_ENV"
          echo "NT_SKILLS_HOST=$fixtures/skills" >> "$GITHUB_ENV"
      - name: Build disposable trusted and sandbox images
        run: docker compose build init sandbox-image
      - name: Certify SQLite production Compose lifecycle
        env:
          NT_CERT_REUSE_LOCAL_IMAGES: "1"
        run: pnpm certify:studio-compose sqlite
      - name: Certify PostgreSQL production Compose lifecycle and controller boundary
        env:
          NT_CERT_REUSE_LOCAL_IMAGES: "1"
        run: pnpm certify:studio-compose postgres
      - name: Record independent Compose certification
        if: success()
        run: |
          echo 'Both full-stack database Compose modes booted and persisted across service restart and project recreation.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Native CLI execution is covered by separate native integration jobs, not the Compose-only CLI version fixture.' >> "$GITHUB_STEP_SUMMARY"

  native-integration:
    name: Native Story (${{ matrix.label }})
    # Secrets aren't available to forks. The mandatory offline job still runs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: root-1-of-4, suite: root, shard: "1/4", certify: true }
          - { label: root-2-of-4, suite: root, shard: "2/4", certify: false }
          - { label: root-3-of-4, suite: root, shard: "3/4", certify: false }
          - { label: root-4-of-4, suite: root, shard: "4/4", certify: false }
          - { label: studio, suite: studio, shard: "", certify: false }
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: noveltea-gen
    steps:
      - uses: actions/checkout@v7
        with:
          path: noveltea-gen
          persist-credentials: false
      - name: Check optional private skills access
        id: skills-access
        env:
          SKILLS_TOKEN: ${{ secrets.NOVELTEA_CI_READ_TOKEN }}
        run: |
          if [[ -z "$SKILLS_TOKEN" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Native Story integration not run: configure NOVELTEA_CI_READ_TOKEN with Contents:read on Cruel/noveltea-skills and Actions:read on Cruel/nt. The offline gate runs without it." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Native Story integration needs read-only access to Cruel/noveltea-skills"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout private skills and canonical Story fixture
        if: steps.skills-access.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          repository: Cruel/noveltea-skills
          ref: master
          path: noveltea-skills
          token: ${{ secrets.NOVELTEA_CI_READ_TOKEN }}
          persist-credentials: false
      - name: Install pnpm
        if: steps.skills-access.outputs.enabled == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: "11.15.0"
      - name: Set up Node.js
        if: steps.skills-access.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: noveltea-gen/pnpm-lock.yaml
      - name: Configure Git identity for disposable test repositories
        if: steps.skills-access.outputs.enabled == 'true'
        run: |
          git config --global user.name "NovelTea CI"
          git config --global user.email "ci@noveltea.invalid"
      - name: Find latest successful public native CLI build
        id: native-build
        if: steps.skills-access.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.NOVELTEA_CI_READ_TOKEN }}
        run: |
          run_id=$(gh api 'repos/Cruel/nt/actions/workflows/build.yml/runs?branch=master&status=success&per_page=1' --jq '.workflow_runs[0].id // empty')
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful native CLI build found in Cruel/nt"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download built native CLI
        if: steps.skills-access.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          repository: Cruel/nt
          run-id: ${{ steps.native-build.outputs.run_id }}
          name: noveltea-host-cli-linux-x64
          github-token: ${{ secrets.NOVELTEA_CI_READ_TOKEN }}
          path: ${{ runner.temp }}/noveltea-cli
      - name: Verify prerequisites and install dependencies
        if: steps.skills-access.outputs.enabled == 'true'
        run: |
          test -s "$RUNNER_TEMP/noveltea-cli/noveltea"
          chmod +x "$RUNNER_TEMP/noveltea-cli/noveltea"
          test -f "$GITHUB_WORKSPACE/noveltea-skills/fixtures/reference-story/creative-direction/last-bell.md"
          echo "NT_NATIVE_CLI=$RUNNER_TEMP/noveltea-cli/noveltea" >> "$GITHUB_ENV"
          echo "NT_REAL_NATIVE_CLI=$RUNNER_TEMP/noveltea-cli/noveltea" >> "$GITHUB_ENV"
          echo "NT_SKILLS_CHECKOUT=$GITHUB_WORKSPACE/noveltea-skills" >> "$GITHUB_ENV"
          echo "NT_STUDIO_SKILLS_SOURCE=$GITHUB_WORKSPACE/noveltea-skills" >> "$GITHUB_ENV"
          pnpm install --frozen-lockfile
          pnpm --dir ../noveltea-skills install --frozen-lockfile
          echo "Native CLI: Cruel/nt Build run ${{ steps.native-build.outputs.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Skills commit: $(git -C ../noveltea-skills rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      # Certification runs once; the four root shards collectively cover every
      # test/*.test.ts file, while Studio runs independently on its own runner.
      - name: Certify native Story contract (no skipped native gate)
        if: steps.skills-access.outputs.enabled == 'true' && matrix.certify
        run: pnpm certify:story
      - name: Run root test shard with native CLI and skills
        if: steps.skills-access.outputs.enabled == 'true' && matrix.suite == 'root'
        run: pnpm exec tsx --test --test-shard=${{ matrix.shard }} test/*.test.ts
      - name: Run full Studio tests with native CLI and skills
        if: steps.skills-access.outputs.enabled == 'true' && matrix.suite == 'studio'
        run: pnpm --filter @noveltea/studio test

  native-integration-gate:
    # Preserve the existing required-check name while all five matrix entries
    # must complete successfully. A failed or cancelled shard fails this gate.
    name: Native Story integration (private skills access)
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: native-integration
    runs-on: ubuntu-24.04
    steps:
      - name: Require all native Story and Studio test jobs
        env:
          RESULT: ${{ needs.native-integration.result }}
        run: test "$RESULT" = success
